# The window is valid Python.  The Scheme tests need Guix and are run
# locally (tests/run.sh).
name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import ast, sys; ast.parse(open('guix-manager').read())"
